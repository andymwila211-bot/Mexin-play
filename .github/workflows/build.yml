name: Build Mexin Play

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Project Zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d .
            rm -f "$ZIP_FILE"
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :core-player:testDebugUnitTest --stacktrace
          else
            gradle :core-player:testDebugUnitTest --stacktrace
          fi

      - name: Build library modules (core-player, core-ui-glass, feature-pulse, feature-flux)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :core-player:assembleDebug :core-ui-glass:assembleDebug :feature-pulse:assembleDebug :feature-flux:assembleDebug --stacktrace
          else
            gradle :core-player:assembleDebug :core-ui-glass:assembleDebug :feature-pulse:assembleDebug :feature-flux:assembleDebug --stacktrace
          fi

      - name: Build app (installable .apk)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload app .apk
        uses: actions/upload-artifact@v4
        with:
          name: mexin-play-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload library .aar outputs
        uses: actions/upload-artifact@v4
        with:
          name: mexin-play-debug-aars
          path: |
            core-player/build/outputs/aar/*.aar
            core-ui-glass/build/outputs/aar/*.aar
            feature-pulse/build/outputs/aar/*.aar
            feature-flux/build/outputs/aar/*.aar
