name: Build Offline AI – Load Your Own Model

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      # ------------------------------------------------------------------
      # Generate the entire Android project on the fly
      # ------------------------------------------------------------------
      - name: Create project source files
        run: |
          # Root Gradle files
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OfflineAI"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # App module structure
          mkdir -p app/src/main/java/com/example/offlineai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets

          # App build.gradle
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.offlineai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.offlineai"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O3 -flto"
                          arguments "-DANDROID_STL=c++_shared"
                      }
                  }
                  ndk { abiFilters "arm64-v8a" }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # AndroidManifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.offlineai">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="OfflineAI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Layout
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <Button
                  android:id="@+id/loadModelButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Load Model (.gguf)" />

              <EditText
                  android:id="@+id/promptEdit"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Enter your prompt" />

              <Button
                  android:id="@+id/generateButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Generate"
                  android:enabled="false" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="8dp">
                  <TextView
                      android:id="@+id/outputText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textIsSelectable="true" />
              </ScrollView>
          </LinearLayout>
          EOF

          # Kotlin MainActivity
          cat > app/src/main/java/com/example/offlineai/MainActivity.kt << 'KOTLINEOF'
          package com.example.offlineai

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : AppCompatActivity() {

              private lateinit var loadModelButton: Button
              private lateinit var promptEdit: EditText
              private lateinit var generateButton: Button
              private lateinit var outputText: TextView

              private var modelLoaded = false
              private val PICK_MODEL_REQUEST = 42
              private var modelFilePath: String? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  loadModelButton = findViewById(R.id.loadModelButton)
                  promptEdit = findViewById(R.id.promptEdit)
                  generateButton = findViewById(R.id.generateButton)
                  outputText = findViewById(R.id.outputText)

                  loadModelButton.setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                          putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("application/octet-stream", "*/*"))
                      }
                      startActivityForResult(intent, PICK_MODEL_REQUEST)
                  }

                  generateButton.setOnClickListener {
                      if (!modelLoaded) {
                          Toast.makeText(this, "Load a model first", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      val prompt = promptEdit.text.toString().trim()
                      if (prompt.isEmpty()) return@setOnClickListener

                      generateButton.isEnabled = false
                      lifecycleScope.launch(Dispatchers.IO) {
                          val result = NativeLib.generate(prompt)
                          withContext(Dispatchers.Main) {
                              outputText.text = result
                              generateButton.isEnabled = true
                          }
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_MODEL_REQUEST && resultCode == Activity.RESULT_OK) {
                      data?.data?.also { uri ->
                          lifecycleScope.launch(Dispatchers.IO) {
                              val path = copyUriToInternal(uri)
                              if (path != null) {
                                  modelFilePath = path
                                  val success = NativeLib.initModel(path)
                                  withContext(Dispatchers.Main) {
                                      if (success) {
                                          modelLoaded = true
                                          generateButton.isEnabled = true
                                          Toast.makeText(this@MainActivity, "Model loaded!", Toast.LENGTH_SHORT).show()
                                      } else {
                                          Toast.makeText(this@MainActivity, "Failed to load model", Toast.LENGTH_LONG).show()
                                      }
                                  }
                              } else {
                                  withContext(Dispatchers.Main) {
                                      Toast.makeText(this@MainActivity, "Could not read model file", Toast.LENGTH_LONG).show()
                                  }
                              }
                          }
                      }
                  }
              }

              private fun copyUriToInternal(uri: Uri): String? {
                  return try {
                      val inputStream = contentResolver.openInputStream(uri) ?: return null
                      val fileName = "loaded_model.gguf"
                      val outFile = File(filesDir, fileName)
                      FileOutputStream(outFile).use { output ->
                          inputStream.copyTo(output)
                      }
                      inputStream.close()
                      outFile.absolutePath
                  } catch (e: Exception) {
                      e.printStackTrace()
                      null
                  }
              }

              object NativeLib {
                  init { System.loadLibrary("native-lib") }
                  external fun initModel(modelPath: String): Boolean
                  external fun generate(prompt: String): String
              }
          }
          KOTLINEOF

          # Native C++
          cat > app/src/main/cpp/native-lib.cpp << 'CPPEOF'
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <mutex>
          #include "llama.h"

          static llama_model *g_model = nullptr;
          static llama_context *g_ctx = nullptr;
          static std::mutex g_mutex;
          static bool g_initialized = false;

          extern "C"
          JNIEXPORT jboolean JNICALL
          Java_com_example_offlineai_MainActivity_00024NativeLib_initModel(
                  JNIEnv *env, jobject, jstring modelPath) {
              std::lock_guard<std::mutex> lock(g_mutex);
              if (g_initialized) {
                  if (g_ctx) {
                      llama_free(g_ctx);
                      g_ctx = nullptr;
                  }
                  if (g_model) {
                      llama_free_model(g_model);
                      g_model = nullptr;
                  }
                  g_initialized = false;
              }

              const char *path = env->GetStringUTFChars(modelPath, nullptr);
              if (!path) return JNI_FALSE;

              llama_backend_init();

              llama_model_params mparams = llama_model_default_params();
              g_model = llama_load_model_from_file(path, mparams);
              env->ReleaseStringUTFChars(modelPath, path);

              if (!g_model) {
                  llama_backend_free();
                  return JNI_FALSE;
              }

              llama_context_params cparams = llama_context_default_params();
              cparams.n_ctx = 512;
              cparams.n_threads = 4;
              cparams.n_batch = 8;

              g_ctx = llama_new_context_with_model(g_model, cparams);
              if (!g_ctx) {
                  llama_free_model(g_model);
                  g_model = nullptr;
                  llama_backend_free();
                  return JNI_FALSE;
              }

              g_initialized = true;
              return JNI_TRUE;
          }

          extern "C"
          JNIEXPORT jstring JNICALL
          Java_com_example_offlineai_MainActivity_00024NativeLib_generate(
                  JNIEnv *env, jobject, jstring prompt) {
              std::lock_guard<std::mutex> lock(g_mutex);
              if (!g_initialized || !g_model || !g_ctx)
                  return env->NewStringUTF("Model not initialized");

              const char *prompt_cstr = env->GetStringUTFChars(prompt, nullptr);
              std::string prompt_str(prompt_cstr);
              env->ReleaseStringUTFChars(prompt, prompt_cstr);

              std::vector<llama_token> tokens(::llama_n_ctx(g_ctx));
              int n_tokens = llama_tokenize(g_model, prompt_str.c_str(), prompt_str.size(),
                                             tokens.data(), tokens.size(), true, false);
              if (n_tokens < 0) return env->NewStringUTF("Tokenisation failed");
              tokens.resize(n_tokens);

              llama_batch batch = llama_batch_get_one(tokens.data(), tokens.size());
              if (llama_decode(g_ctx, batch) != 0)
                  return env->NewStringUTF("Decode failed");

              std::string result;
              const int max_tokens = 128;
              for (int i = 0; i < max_tokens; i++) {
                  auto logits = llama_get_logits_ith(g_ctx, -1);
                  llama_token new_token = 0;
                  float max_logit = -1e9;
                  int n_vocab = llama_n_vocab(g_model);
                  for (llama_token tok = 0; tok < n_vocab; tok++) {
                      if (logits[tok] > max_logit) {
                          max_logit = logits[tok];
                          new_token = tok;
                      }
                  }
                  if (llama_token_is_eog(g_model, new_token) || new_token == llama_token_eos(g_model))
                      break;

                  llama_batch single = llama_batch_get_one(&new_token, 1);
                  if (llama_decode(g_ctx, single) != 0) break;

                  char buf[8];
                  int len = llama_token_to_piece(g_model, new_token, buf, sizeof(buf), 0, true);
                  if (len > 0) result.append(buf, len);
              }
              return env->NewStringUTF(result.c_str());
          }
          CPPEOF

          # CMakeLists.txt
          cat > app/src/main/cpp/CMakeLists.txt << 'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.18)
          project("offlineai")

          set(LLAMA_BUILD_TESTS OFF)
          set(LLAMA_BUILD_EXAMPLES OFF)
          set(LLAMA_BUILD_SERVER OFF)
          set(BUILD_SHARED_LIBS OFF)

          add_subdirectory(llama.cpp)

          add_library(native-lib SHARED native-lib.cpp)
          target_link_libraries(native-lib
              llama
              android
              log
          )
          CMAKE_EOF

          touch app/proguard-rules.pro

      # ------------------------------------------------------------------
      # Fetch llama.cpp
      # ------------------------------------------------------------------
      - name: Add llama.cpp submodule
        run: |
          cd app/src/main/cpp
          git init
          git submodule add https://github.com/ggerganov/llama.cpp.git
          cd -

      - name: Initialize submodules
        run: git submodule update --init --recursive

      # ------------------------------------------------------------------
      # Install Gradle and generate wrapper (FIXED)
      # ------------------------------------------------------------------
      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -d /opt/gradle gradle-8.5-bin.zip
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v3

      # ------------------------------------------------------------------
      # Build the APK (no model download)
      # ------------------------------------------------------------------
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-app
          path: app/build/outputs/apk/debug/app-debug.apk              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OfflineAI"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
