                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O3 -flto"
                          arguments "-DANDROID_STL=c++_shared"
                      }
                  }
                  ndk { abiFilters "arm64-v8a" }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # AndroidManifest (no special permissions needed because of SAF)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.offlineai">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="OfflineAI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Layout: added a "Load Model" button
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <Button
                  android:id="@+id/loadModelButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Load Model (.gguf)" />

              <EditText
                  android:id="@+id/promptEdit"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Enter your prompt" />

              <Button
                  android:id="@+id/generateButton"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Generate"
                  android:enabled="false" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="8dp">
                  <TextView
                      android:id="@+id/outputText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textIsSelectable="true" />
              </ScrollView>
          </LinearLayout>
          EOF

          # Kotlin MainActivity – with file picker
          cat > app/src/main/java/com/example/offlineai/MainActivity.kt << 'KOTLINEOF'
          package com.example.offlineai

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : AppCompatActivity() {

              private lateinit var loadModelButton: Button
              private lateinit var promptEdit: EditText
              private lateinit var generateButton: Button
              private lateinit var outputText: TextView

              private var modelLoaded = false
              private val PICK_MODEL_REQUEST = 42
              private var modelFilePath: String? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  loadModelButton = findViewById(R.id.loadModelButton)
                  promptEdit = findViewById(R.id.promptEdit)
                  generateButton = findViewById(R.id.generateButton)
                  outputText = findViewById(R.id.outputText)

                  loadModelButton.setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"   // GGUF files usually have no MIME type; accept all
                          putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("application/octet-stream", "*/*"))
                      }
                      startActivityForResult(intent, PICK_MODEL_REQUEST)
                  }

                  generateButton.setOnClickListener {
                      if (!modelLoaded) {
                          Toast.makeText(this, "Load a model first", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      val prompt = promptEdit.text.toString().trim()
                      if (prompt.isEmpty()) return@setOnClickListener

                      generateButton.isEnabled = false
                      lifecycleScope.launch(Dispatchers.IO) {
                          val result = NativeLib.generate(prompt)
                          withContext(Dispatchers.Main) {
                              outputText.text = result
                              generateButton.isEnabled = true
                          }
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_MODEL_REQUEST && resultCode == Activity.RESULT_OK) {
                      data?.data?.also { uri ->
                          lifecycleScope.launch(Dispatchers.IO) {
                              val path = copyUriToInternal(uri)
                              if (path != null) {
                                  modelFilePath = path
                                  val success = NativeLib.initModel(path)
                                  withContext(Dispatchers.Main) {
                                      if (success) {
                                          modelLoaded = true
                                          generateButton.isEnabled = true
                                          Toast.makeText(this@MainActivity, "Model loaded!", Toast.LENGTH_SHORT).show()
                                      } else {
                                          Toast.makeText(this@MainActivity, "Failed to load model", Toast.LENGTH_LONG).show()
                                      }
                                  }
                              } else {
                                  withContext(Dispatchers.Main) {
                                      Toast.makeText(this@MainActivity, "Could not read model file", Toast.LENGTH_LONG).show()
                                  }
                              }
                          }
                      }
                  }
              }

              // Copy the selected URI to internal storage so C++ can read it as a file path
              private fun copyUriToInternal(uri: Uri): String? {
                  return try {
                      val inputStream = contentResolver.openInputStream(uri) ?: return null
                      val fileName = "loaded_model.gguf"
                      val outFile = File(filesDir, fileName)
                      FileOutputStream(outFile).use { output ->
                          inputStream.copyTo(output)
                      }
                      inputStream.close()
                      outFile.absolutePath
                  } catch (e: Exception) {
                      e.printStackTrace()
                      null
                  }
              }

              object NativeLib {
                  init { System.loadLibrary("native-lib") }
                  external fun initModel(modelPath: String): Boolean
                  external fun generate(prompt: String): String
              }
          }
          KOTLINEOF

          # Native C++ (unchanged, still uses llama.cpp)
          cat > app/src/main/cpp/native-lib.cpp << 'CPPEOF'
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <mutex>
          #include "llama.h"

          static llama_model *g_model = nullptr;
          static llama_context *g_ctx = nullptr;
          static std::mutex g_mutex;
          static bool g_initialized = false;

          extern "C"
          JNIEXPORT jboolean JNICALL
          Java_com_example_offlineai_MainActivity_00024NativeLib_initModel(
                  JNIEnv *env, jobject, jstring modelPath) {
              std::lock_guard<std::mutex> lock(g_mutex);
              if (g_initialized) {
                  // If a model was previously loaded, free it
                  if (g_ctx) {
                      llama_free(g_ctx);
                      g_ctx = nullptr;
                  }
                  if (g_model) {
                      llama_free_model(g_model);
                      g_model = nullptr;
                  }
                  g_initialized = false;
              }

              const char *path = env->GetStringUTFChars(modelPath, nullptr);
              if (!path) return JNI_FALSE;

              llama_backend_init();

              llama_model_params mparams = llama_model_default_params();
              g_model = llama_load_model_from_file(path, mparams);
              env->ReleaseStringUTFChars(modelPath, path);

              if (!g_model) {
                  llama_backend_free();
                  return JNI_FALSE;
              }

              llama_context_params cparams = llama_context_default_params();
              cparams.n_ctx = 512;      // context size – adjust if your model supports longer
              cparams.n_threads = 4;    // tune this to your phone's performance cores
              cparams.n_batch = 8;

